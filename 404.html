<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d90f0f;
            --primary-hover: #b30c0c;
            --bg-main: #fafafa;
            --text-main: #111111;
            --text-muted: #777777;
            --border-color: #eaeaea;
            --radius-md: 12px;
            --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }

        .logo-placeholder {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 32px;
        }

        .error-code {
            font-size: 96px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 32px;
            text-wrap: pretty;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
                border: none;
                background: transparent;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder">Wecraft Dashboard</div>
        <div class="error-code">404</div>
        <h1>Lost in the Craft</h1>
        <p>The page you are looking for doesn't exist or has been moved. Let's get you back to the dashboard.</p>
        <a href="/" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
